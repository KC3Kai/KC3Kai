# TEST ON ALL BRANCHES AND EVENTS
name: CI Tests

on: [push, pull_request]

jobs:
  test:
    name: Unit tests
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        node-version: [24.x]
        os: [ubuntu-latest]

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Use node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
    - name: Use npm test
      timeout-minutes: 10
      run: |
        npm install
        npm test
